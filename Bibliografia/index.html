<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrategia Corporativa, Gestión y Planificación de Marketing - Bibliografía</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-base: #054C50; 
            --accent-bright: #4ce6ef; 
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(5, 76, 80, 0.4);
            --text-main: #ffffff;
            --text-dim: #d0f0f2;
        }

        body {
            margin: 0; padding: 0; min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: #021a1b;
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; cursor: default;
        }

        .fluid-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; background: #011112; filter: blur(80px);
        }
        .fluid-layer { position: absolute; border-radius: 50%; opacity: 0.35; animation: fluidMove infinite alternate ease-in-out; }
        .layer-1 { background: radial-gradient(circle, var(--accent-base) 0%, transparent 70%); width: 100vw; height: 100vw; top: -30%; left: -10%; animation-duration: 20s; }
        .layer-2 { background: radial-gradient(circle, #083335 0%, transparent 70%); width: 80vw; height: 80vw; bottom: -20%; right: -10%; animation-duration: 25s; }
        @keyframes fluidMove { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(10%, 5%) scale(1.1); } }

        /* Animaciones de entrada de impacto */
        @keyframes impactEntry {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @keyframes headerEntry {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-instruction, .main-header {
            animation: headerEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .nav-instruction {
            width: 90vw; max-width: 1400px;
            background: rgba(5, 76, 80, 0.15);
            border: 1px dashed var(--accent-bright);
            padding: 15px; border-radius: 12px;
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem; color: var(--accent-bright);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .main-header { text-align: center; padding: 30px 20px; z-index: 1; animation-delay: 0.15s; }
        .main-header h1 { font-weight: 300; font-size: 2rem; letter-spacing: 4px; text-transform: uppercase; margin: 0; background: linear-gradient(to right, #fff, var(--text-dim)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .main-header .line { width: 60px; height: 3px; background: var(--accent-bright); margin: 15px auto; }

        .reference-grid {
            display: grid; width: 90vw; max-width: 1400px;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px; padding-bottom: 80px; z-index: 1;
        }

        .card {
            font-family: 'Poppins', sans-serif;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 25px;
            display: flex; flex-direction: column;
            transition: all 0.3s ease;
            min-height: 160px;
            /* Aplicamos la animación escalonada mediante el retraso dinámico de JS */
            opacity: 0;
            animation: impactEntry 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .card:hover { 
            border-color: var(--accent-bright); 
            transform: translateY(-5px); 
            background: rgba(5, 76, 80, 0.12); 
            box-shadow: 0 10px 20px rgba(5, 76, 80, 0.25); 
        }

        .author-tag { font-size: 0.75rem; font-weight: 600; color: var(--accent-bright); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }
        .title { font-size: 0.9rem; font-weight: 400; line-height: 1.6; color: var(--text-main); margin-bottom: 15px; }

        .footer-info {
            font-size: 0.75rem; font-weight: 300; color: var(--text-dim);
            border-top: 1px solid rgba(5, 76, 80, 0.3);
            padding-top: 15px; margin-top: auto; word-break: break-all;
        }

        .link-text {
            color: var(--accent-bright);
            text-decoration: underline;
            transition: color 0.2s;
        }
        .link-text:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="fluid-background">
        <div class="fluid-layer layer-1"></div>
        <div class="fluid-layer layer-2"></div>
    </div>

    <div class="nav-instruction">
        🎯 <b>Instrucción de Navegación:</b> Consulta los textos y artículos fundamentales sobre estrategia corporativa, ventajas competitivas, gerencia de proyectos y elaboración de planes de marketing.
    </div>

    <header class="main-header">
        <h1>Bibliografía</h1>
        <div class="line"></div>
    </header>

    <main class="reference-grid" id="grid"></main>

    <script>
        const sources = [
            { a: "Ansoff, H. I. (1957)", t: "Strategies for diversification", f: "Harvard Business Review, 35(5), 113–124" },
            { a: "David, F. R., & David, F. R. (2017)", t: "Strategic management: A competitive advantage approach, concepts and cases", f: "Pearson Education" },
            { a: "Kaplan, R. S., & Norton, D. P. (1996)", t: "The balanced scorecard: Translating strategy into action", f: "Harvard Business School Press" },
            { a: "Kerzner, H. (2017)", t: "Project management: A systems approach to planning, scheduling, and controlling", f: "John Wiley & Sons" },
            { a: "Kotler, P., & Keller, K. L. (2016)", t: "Dirección de marketing", f: "Pearson Educación" },
            { a: "Lambin, J.-J., & de Moerloose, C. (2012)", t: "Dirección de marketing: Gestión estratégica y operativa del mercado", f: "McGraw-Hill Interamericana" },
            { a: "Malhotra, N. K. (2008)", t: "Investigación de mercados: Un enfoque aplicado", f: "Pearson Educación" },
            { a: "McDonald, M. (2016)", t: "Malcolm McDonald on marketing planning: Understanding marketing plans and strategy", f: "Kogan Page" },
            { a: "Morales Merchán, N., Calderón Morán, E., & Mejía Garcés, R. (2017)", t: "Marketing operativo de precios y canales de distribución", f: "Revista Contribuciones a la Economía" },
            { a: "Porter, M. E. (1985)", t: "Competitive advantage: Creating and sustaining superior performance", f: "Free Press" },
            { a: "Sainz de Vicuña Ancín, J. M. (2020)", t: "El plan de marketing en la práctica", f: "ESIC Editorial" }
        ];

        const grid = document.getElementById('grid');

        sources.forEach((s, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            // Retardo escalonado de 0.08s por cada tarjeta para un efecto cascada precioso
            card.style.animationDelay = `${0.25 + (index * 0.07)}s`;
            
            let footerContent = s.f;
            if (s.u) {
                footerContent += ` — <a href="${s.u}" target="_blank" class="link-text">${s.u}</a>`;
            }

            let html = `
                <div class="author-tag">${s.a}</div>
                <div class="title">${s.t}</div>
                <div class="footer-info">${footerContent}</div>
            `;

            card.innerHTML = html;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
