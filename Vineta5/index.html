<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estrategias de Crecimiento - Distribución 2x2</title>
  
  <!-- Tipografía Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #0a0a0a;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.15);
      --card-hover-border: rgba(255, 255, 255, 0.4);
      --modal-bg: rgba(20, 20, 20, 0.88);
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif !important;
      text-align: left;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Fondo animado monocromático */
    .background-blobs {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
      filter: blur(100px);
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      opacity: 0.22;
      animation: float 18s infinite alternate ease-in-out;
    }

    .blob-1 {
      width: 500px;
      height: 500px;
      background: #ffffff;
      top: -15%;
      left: -10%;
    }

    .blob-2 {
      width: 450px;
      height: 450px;
      background: #71717a;
      bottom: -15%;
      right: -10%;
      animation-delay: -6s;
    }

    .blob-3 {
      width: 350px;
      height: 350px;
      background: #a1a1aa;
      top: 40%;
      left: 30%;
      animation-delay: -12s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, -40px) scale(1.1); }
      100% { transform: translate(-40px, 50px) scale(0.95); }
    }

    /* Contenedor principal */
    .container {
      max-width: 1000px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2.5rem;
    }

    /* Indicación interactiva */
    .instruction-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 0.6rem 1.4rem;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #f4f4f5;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      animation: pulse-border 3s infinite alternate;
    }

    @keyframes pulse-border {
      0% { border-color: rgba(255, 255, 255, 0.15); box-shadow: 0 0 10px rgba(255, 255, 255, 0.05); }
      100% { border-color: rgba(255, 255, 255, 0.5); box-shadow: 0 0 25px rgba(255, 255, 255, 0.2); }
    }

    .instruction-badge i {
      color: #ffffff;
    }

    /* Rejilla Forzada a 2 columnas x 2 filas */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
      width: 100%;
    }

    /* Estilo Glassmorphism Monocromático */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 230px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
    }

    .glass-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--card-hover-border);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 255, 255, 0.1);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-icon {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 1.35rem;
      font-weight: 600;
      color: #ffffff;
      margin-top: 1.5rem;
      line-height: 1.35;
      letter-spacing: -0.01em;
      text-align: left;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 1.5rem;
      transition: color 0.3s ease;
    }

    .glass-card:hover .card-footer {
      color: #ffffff;
    }

    .glass-card:hover .card-footer i {
      transform: translateX(5px);
    }

    .card-footer i {
      transition: transform 0.3s ease;
    }

    /* Modal Emergente */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-container {
      background: var(--modal-bg);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 28px;
      width: 100%;
      max-width: 760px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 2.5rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      transform: scale(0.9) translateY(20px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .modal-overlay.active .modal-container {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .modal-title-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      text-align: left;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: rotate(90deg);
    }

    /* Recuadro unificado para el contenido modal */
    .single-modal-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 1.75rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .single-modal-box p {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #e4e4e7;
      font-weight: 300;
      text-align: left !important;
    }

    /* Adaptabilidad Móvil */
    @media (max-width: 768px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }
      .modal-container {
        padding: 1.5rem;
      }
      .single-modal-box {
        padding: 1.25rem;
      }
      .modal-title {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>

  <!-- Fondo animado -->
  <div class="background-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="container">
    
    <!-- Mensaje de instrucción -->
    <div class="instruction-badge">
      <i data-lucide="mouse-pointer-click"></i>
      <span>Haga clic sobre las tarjetas para ampliar la información</span>
    </div>

    <!-- Rejilla en 2x2 -->
    <div class="cards-grid">
      
      <!-- Fila 1 - Columna 1 -->
      <div class="glass-card" onclick="openModal('penetration')">
        <div class="card-top">
          <div class="card-icon">
            <i data-lucide="target"></i>
          </div>
        </div>
        <div>
          <h2 class="card-title">Penetración de mercado</h2>
          <div class="card-footer">
            <span>Ver detalles</span>
            <i data-lucide="arrow-right" size="16"></i>
          </div>
        </div>
      </div>

      <!-- Fila 1 - Columna 2 -->
      <div class="glass-card" onclick="openModal('productDev')">
        <div class="card-top">
          <div class="card-icon">
            <i data-lucide="box"></i>
          </div>
        </div>
        <div>
          <h2 class="card-title">Desarrollo de productos o servicios</h2>
          <div class="card-footer">
            <span>Ver detalles</span>
            <i data-lucide="arrow-right" size="16"></i>
          </div>
        </div>
      </div>

      <!-- Fila 2 - Columna 1 -->
      <div class="glass-card" onclick="openModal('marketDev')">
        <div class="card-top">
          <div class="card-icon">
            <i data-lucide="globe"></i>
          </div>
        </div>
        <div>
          <h2 class="card-title">Desarrollo de mercados</h2>
          <div class="card-footer">
            <span>Ver detalles</span>
            <i data-lucide="arrow-right" size="16"></i>
          </div>
        </div>
      </div>

      <!-- Fila 2 - Columna 2 -->
      <div class="glass-card" onclick="openModal('diversification')">
        <div class="card-top">
          <div class="card-icon">
            <i data-lucide="layers"></i>
          </div>
        </div>
        <div>
          <h2 class="card-title">Diversificación</h2>
          <div class="card-footer">
            <span>Ver detalles</span>
            <i data-lucide="arrow-right" size="16"></i>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal Emergente -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
    <div class="modal-container">
      <div class="modal-header">
        <div class="modal-title-group">
          <div class="card-icon" id="modalIcon">
            <i data-lucide="info"></i>
          </div>
          <h3 class="modal-title" id="modalTitle">Título</h3>
        </div>
        <button class="close-btn" onclick="closeModal()">
          <i data-lucide="x"></i>
        </button>
      </div>
      
      <div class="single-modal-box" id="modalBody">
        <!-- Contenido inyectado dinámicamente -->
      </div>
    </div>
  </div>

  <script>
    // Inicializar iconos
    lucide.createIcons();

    // Texto exacto de la imagen
    const data = {
      penetration: {
        title: "Penetración de mercado",
        icon: "target",
        content: [
          "Consiste en incrementar la participación de la organización mediante los productos o servicios que actualmente ofrece en los mercados donde ya compite. En una empresa inmobiliaria puede implicar fortalecer los canales comerciales para incrementar las ventas en un segmento ya atendido; mientras que una firma de consultoría puede buscar aumentar la contratación de sus servicios entre clientes empresariales actuales."
        ]
      },
      productDev: {
        title: "Desarrollo de productos o servicios",
        icon: "box",
        content: [
          "Implica incorporar nuevas soluciones dirigidas a mercados que la organización ya conoce. Una desarrolladora inmobiliaria podría introducir nuevas tipologías de vivienda sostenible o inteligente, mientras que una firma de ingeniería podría ampliar su portafolio mediante servicios BIM, consultoría en sostenibilidad o gestión especializada de activos."
        ]
      },
      marketDev: {
        title: "Desarrollo de mercados",
        icon: "globe",
        content: [
          "Consiste en llevar los productos o servicios existentes hacia nuevos mercados. Puede materializarse mediante la expansión hacia otras ciudades o regiones, la atención de nuevos segmentos de clientes o el ingreso a mercados empresariales o institucionales que anteriormente no eran atendidos."
        ]
      },
      diversification: {
        title: "Diversificación",
        icon: "layers",
        content: [
          "Supone ingresar simultáneamente en nuevos mercados mediante productos o servicios diferentes a los que conforman la oferta actual. Por ejemplo, una organización concentrada tradicionalmente en el desarrollo de vivienda podría crear una nueva unidad de negocio orientada a infraestructura, operación de activos o servicios especializados para clientes institucionales."
        ]
      }
    };

    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalIcon = document.getElementById('modalIcon');

    function openModal(key) {
      const item = data[key];
      if (!item) return;

      modalTitle.textContent = item.title;
      modalIcon.innerHTML = `<i data-lucide="${item.icon}"></i>`;
      modalBody.innerHTML = item.content.map(p => `<p>${p}</p>`).join('');
      
      lucide.createIcons();
      modalOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      document.body.style.overflow = '';
    }

    function closeModalOnOverlay(e) {
      if (e.target === modalOverlay) {
        closeModal();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
